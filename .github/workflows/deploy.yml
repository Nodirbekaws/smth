name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::980819806741:role/github-actions-react-deploy
          aws-region: us-east-1

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://smth-test/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2FU9VSE7F2Z72 \
            --paths "/*"