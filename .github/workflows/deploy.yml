name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub repositoryni olish
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Dependencies
      - name: Install dependencies
        run: npm ci

      # 4. React production build
      - name: Build
        run: npm run build

      # 5. AWS OIDC authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::980819806741:role/reactprod-test
          aws-region: us-east-1

      # 6. Upload dist → S3
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://smth-test/ --delete

      # 7. Clear CloudFront cache
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2FU9VSE7F2Z72 \
            --paths "/*"